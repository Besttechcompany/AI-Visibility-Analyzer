<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Profile | AI Visibility Analyzer</title>

    <link
        rel="stylesheet"
        href="css/profile.css"
    >

</head>


<body>

<div class="dashboard-container">


    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <aside class="sidebar">


        <!-- BRAND -->

        <div class="brand">

            <h1>
                AI Visibility
            </h1>

            <span>
                Dashboard
            </span>

        </div>


        <!-- NAVIGATION -->

        <nav class="sidebar-nav">


            <!-- DASHBOARD -->

            <a
                href="dashboard.html"
                class="nav-item"
            >

                <span class="nav-icon">
                    📊
                </span>

                <span>
                    Dashboard
                </span>

            </a>


            <!-- WEBSITE ANALYSIS -->

            <a
                href="dashboard.html"
                class="nav-item"
            >

                <span class="nav-icon">
                    🌐
                </span>

                <span>
                    Website Analysis
                </span>

            </a>


            <!-- LOGS -->

            <a
                href="logs.html"
                class="nav-item"
            >

                <span class="nav-icon">
                    📈
                </span>

                <span>
                    Logs
                </span>

            </a>


            <!-- AI VISIBILITY -->

            <a
                href="dashboard.html"
                class="nav-item"
            >

                <span class="nav-icon">
                    🤖
                </span>

                <span>
                    AI Visibility
                </span>

            </a>


            <!-- SETTINGS -->

            <a
                href="dashboard.html"
                class="nav-item"
            >

                <span class="nav-icon">
                    ⚙️
                </span>

                <span>
                    Settings
                </span>

            </a>


            <!-- PROFILE -->

            <a
                href="profile.html"
                class="nav-item active"
            >

                <span class="nav-icon">
                    👤
                </span>

                <span>
                    Profile
                </span>

            </a>


        </nav>


        <!-- LOGOUT -->

        <button
            type="button"
            class="logout-btn"
            onclick="logout()"
        >

            🚪 Logout

        </button>


    </aside>



    <!-- =====================================================
         MAIN CONTENT
    ====================================================== -->

    <main class="main-content">


        <!-- PAGE HEADER -->

        <div class="page-header">

            <h2>
                My Profile
            </h2>

            <p>
                Manage your account information and profile details.
            </p>

        </div>



        <!-- =================================================
             PROFILE CARD
        ================================================== -->

        <div
            id="profile-card"
            class="profile-card"
        >


            <!-- INITIAL LOADING -->

            <div class="profile-loading">

                <span class="button-loader"></span>

                <span>
                    Loading profile...
                </span>

            </div>


        </div>



        <!-- =================================================
             MESSAGE
        ================================================== -->

        <div
            id="message"
            class="message"
            role="alert"
        ></div>


    </main>


</div>



<!-- =========================================================
     PROFILE PHOTO INPUT
========================================================== -->

<input
    type="file"
    id="profilePhotoInput"
    accept="image/*"
    hidden
>



<!-- =========================================================
     PROFILE JAVASCRIPT
========================================================== -->

<script
    src="js/profile.js"
></script>


</body>

</html>
