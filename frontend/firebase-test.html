<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Firebase Authentication Test</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      padding: 20px;
    }

    .card {
      width: 440px;
      max-width: 100%;
      padding: 32px;
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
      color: #111827;
    }

    .subtitle {
      margin: 0 0 25px;
      color: #6b7280;
      font-size: 14px;
    }

    input {
      width: 100%;
      height: 46px;
      padding: 0 14px;
      margin-bottom: 12px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      height: 46px;
      margin-top: 10px;
      border: none;
      border-radius: 9px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s ease;
    }

    button:hover {
      opacity: 0.92;
    }

    #registerBtn {
      background: #2563eb;
      color: white;
    }

    #loginBtn {
      background: #16a34a;
      color: white;
    }

    #googleBtn {
      background: white;
      color: #111827;
      border: 1px solid #d1d5db;
    }

    #logoutBtn {
      background: #dc2626;
      color: white;
    }

    #profileBtn {
      background: #7c3aed;
      color: white;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 18px 0 5px;
      color: #9ca3af;
      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background: #e5e7eb;
    }

    #status {
      margin-top: 22px;
      padding: 15px;
      background: #f3f4f6;
      border-radius: 10px;
      color: #374151;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .section-title {
      margin-top: 25px;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 700;
      color: #374151;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

  </style>

</head>


<body>

  <div class="card">

    <h1>Firebase Authentication Test</h1>

    <p class="subtitle">
      AI Visibility Analyzer
    </p>


    <!-- EMAIL -->

    <div class="section-title">
      Email Authentication
    </div>

    <input
      type="email"
      id="email"
      placeholder="Enter email"
      autocomplete="email"
    >

    <input
      type="password"
      id="password"
      placeholder="Enter password"
      autocomplete="current-password"
    >


    <button id="registerBtn">
      Create Account
    </button>


    <button id="loginBtn">
      Login
    </button>


    <div class="divider">
      OR
    </div>


    <!-- GOOGLE -->

    <button id="googleBtn">
      Continue with Google
    </button>


    <!-- FIRESTORE -->

    <div class="section-title">
      Firestore
    </div>


    <button id="profileBtn">
      Create / Check Firestore Profile
    </button>


    <!-- LOGOUT -->

    <button id="logoutBtn">
      Logout
    </button>


    <!-- STATUS -->

    <div id="status">
      Checking Firebase authentication...
    </div>

  </div>


  <script type="module">


    // ==========================================
    // FIREBASE AUTH IMPORTS
    // ==========================================

    import {
      auth,
      googleProvider,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      signInWithPopup,
      signOut,
      onAuthStateChanged
    } from "./js/firebase-auth.js";


    // ==========================================
    // FIRESTORE IMPORTS
    // ==========================================

    import {
      createUserProfile,
      getUserProfile
    } from "./js/firebase-user.js";


    // ==========================================
    // DOM ELEMENTS
    // ==========================================

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const registerBtn =
      document.getElementById("registerBtn");

    const loginBtn =
      document.getElementById("loginBtn");

    const googleBtn =
      document.getElementById("googleBtn");

    const profileBtn =
      document.getElementById("profileBtn");

    const logoutBtn =
      document.getElementById("logoutBtn");

    const status =
      document.getElementById("status");


    // ==========================================
    // STATUS FUNCTION
    // ==========================================

    function showStatus(message) {

      status.textContent = message;

    }


    // ==========================================
    // CREATE ACCOUNT
    // ==========================================

    registerBtn.addEventListener(
      "click",
      async function () {

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;


        if (!email || !password) {

          showStatus(
            "Please enter an email and password."
          );

          return;

        }


        if (password.length < 6) {

          showStatus(
            "Password must contain at least 6 characters."
          );

          return;

        }


        try {

          showStatus(
            "Creating Firebase account..."
          );


          const userCredential =
            await createUserWithEmailAndPassword(
              auth,
              email,
              password
            );


          const user =
            userCredential.user;


          // --------------------------------------
          // CREATE FIRESTORE PROFILE
          // --------------------------------------

          await createUserProfile(user);


          showStatus(
            "ACCOUNT CREATED SUCCESSFULLY\n\n" +

            "Firebase UID:\n" +
            user.uid +

            "\n\nEmail:\n" +
            user.email +

            "\n\nFirestore Profile:\n" +
            "Created successfully" +

            "\n\nPlan:\n" +
            "free"
          );


          console.log(
            "Firebase user:",
            user
          );


        } catch (error) {

          console.error(
            "Registration error:",
            error
          );


          showStatus(
            "REGISTRATION ERROR\n\n" +

            "Code:\n" +
            error.code +

            "\n\nMessage:\n" +
            error.message
          );

        }

      }
    );


    // ==========================================
    // LOGIN
    // ==========================================

    loginBtn.addEventListener(
      "click",
      async function () {

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;


        if (!email || !password) {

          showStatus(
            "Please enter an email and password."
          );

          return;

        }


        try {

          showStatus(
            "Logging in..."
          );


          const userCredential =
            await signInWithEmailAndPassword(
              auth,
              email,
              password
            );


          const user =
            userCredential.user;


          showStatus(
            "LOGIN SUCCESSFUL\n\n" +

            "Firebase UID:\n" +
            user.uid +

            "\n\nEmail:\n" +
            user.email
          );


        } catch (error) {

          console.error(
            "Login error:",
            error
          );


          showStatus(
            "LOGIN ERROR\n\n" +

            "Code:\n" +
            error.code +

            "\n\nMessage:\n" +
            error.message
          );

        }

      }
    );


    // ==========================================
    // GOOGLE LOGIN
    // ==========================================

    googleBtn.addEventListener(
      "click",
      async function () {

        try {

          showStatus(
            "Opening Google sign-in..."
          );


          const result =
            await signInWithPopup(
              auth,
              googleProvider
            );


          const user =
            result.user;


          // --------------------------------------
          // CREATE / CHECK FIRESTORE PROFILE
          // --------------------------------------

          let profile =
            await getUserProfile(user.uid);


          if (!profile) {

            await createUserProfile(user);

            profile =
              await getUserProfile(user.uid);

          }


          showStatus(
            "GOOGLE LOGIN SUCCESSFUL\n\n" +

            "Firebase UID:\n" +
            user.uid +

            "\n\nName:\n" +
            (user.displayName || "Not available") +

            "\n\nEmail:\n" +
            user.email +

            "\n\nFirestore Profile:\n" +
            "Available" +

            "\n\nPlan:\n" +
            (profile?.plan || "free")
          );


        } catch (error) {

          console.error(
            "Google login error:",
            error
          );


          showStatus(
            "GOOGLE LOGIN ERROR\n\n" +

            "Code:\n" +
            error.code +

            "\n\nMessage:\n" +
            error.message
          );

        }

      }
    );


    // ==========================================
    // CREATE / CHECK FIRESTORE PROFILE
    // ==========================================

    profileBtn.addEventListener(
      "click",
      async function () {

        const user =
          auth.currentUser;


        if (!user) {

          showStatus(
            "No Firebase user is logged in.\n\n" +
            "Please create an account or login first."
          );

          return;

        }


        try {

          showStatus(
            "Checking Firestore profile..."
          );


          let profile =
            await getUserProfile(user.uid);


          // --------------------------------------
          // PROFILE DOES NOT EXIST
          // --------------------------------------

          if (!profile) {

            await createUserProfile(user);

            profile =
              await getUserProfile(user.uid);

          }


          showStatus(
            "FIRESTORE PROFILE FOUND\n\n" +

            "UID:\n" +
            user.uid +

            "\n\nName:\n" +
            (profile?.name || "") +

            "\n\nEmail:\n" +
            (profile?.email || "") +

            "\n\nPlan:\n" +
            (profile?.plan || "free") +

            "\n\nProfile is working correctly."
          );


        } catch (error) {

          console.error(
            "Firestore error:",
            error
          );


          showStatus(
            "FIRESTORE ERROR\n\n" +

            "Code:\n" +
            error.code +

            "\n\nMessage:\n" +
            error.message
          );

        }

      }
    );


    // ==========================================
    // LOGOUT
    // ==========================================

    logoutBtn.addEventListener(
      "click",
      async function () {

        try {

          await signOut(auth);


          showStatus(
            "LOGGED OUT SUCCESSFULLY"
          );


        } catch (error) {

          console.error(
            "Logout error:",
            error
          );


          showStatus(
            "LOGOUT ERROR\n\n" +
            error.message
          );

        }

      }
    );


    // ==========================================
    // AUTH STATE
    // ==========================================

    onAuthStateChanged(
      auth,
      async function (user) {

        if (user) {

          console.log(
            "Current Firebase user:",
            user
          );


          try {

            const profile =
              await getUserProfile(user.uid);


            if (profile) {

              showStatus(
                "FIREBASE USER IS LOGGED IN\n\n" +

                "UID:\n" +
                user.uid +

                "\n\nEmail:\n" +
                user.email +

                "\n\nFirestore Profile:\n" +
                "Found" +

                "\n\nPlan:\n" +
                (profile.plan || "free")
              );

            } else {

              showStatus(
                "FIREBASE USER IS LOGGED IN\n\n" +

                "UID:\n" +
                user.uid +

                "\n\nEmail:\n" +
                user.email +

                "\n\nFirestore Profile:\n" +
                "Not created yet"
              );

            }

          } catch (error) {

            console.error(
              "Profile check error:",
              error
            );


            showStatus(
              "FIREBASE USER IS LOGGED IN\n\n" +

              "UID:\n" +
              user.uid +

              "\n\nEmail:\n" +
              user.email +

              "\n\nFirestore profile could not be checked."
            );

          }


        } else {

          showStatus(
            "No Firebase user is currently logged in."
          );

        }

      }
    );


  </script>

</body>

</html>
