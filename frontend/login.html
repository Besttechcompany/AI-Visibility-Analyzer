<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Login | AI Visibility Analyzer
    </title>


    <!-- =====================================================
         CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="css/login.css"
    >

</head>


<body>


    <!-- =====================================================
         LOGIN CARD
    ====================================================== -->

    <div class="login-card">


        <h1>

            Welcome Back

        </h1>


        <p>

            Sign in with your Google account to access
            your AI Visibility Dashboard.

        </p>


        <!-- =================================================
             GOOGLE LOGIN BUTTON
        ================================================== -->

        <button
            type="button"
            class="google-btn"
            onclick="googleLogin()"
        >

            <img
                src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
                alt="Google Logo"
            >

            <span>

                Continue with Google

            </span>

        </button>


        <!-- =================================================
             BACK HOME
        ================================================== -->

        <a
            href="index.html"
            class="back-home"
        >

            ← Back to Home

        </a>


    </div>



    <!-- =====================================================
         LOADING OVERLAY
    ====================================================== -->

    <div
        id="loadingOverlay"
        class="loading-overlay"
    >


        <div class="loader-card">


            <!-- =================================================
                 AI ICON
            ================================================== -->

            <div class="ai-logo">

                🤖

            </div>


            <!-- =================================================
                 TITLE
            ================================================== -->

            <h2>

                AI Visibility Analyzer

            </h2>


            <!-- =================================================
                 HORIZONTAL PROGRESS BAR
            ================================================== -->

            <div class="login-progress-container">


                <div class="login-progress-track">


                    <div
                        id="loginProgressBar"
                        class="login-progress-bar"
                    >

                        <span
                            id="loadingPercentage"
                            class="login-progress-text"
                        >

                            0%

                        </span>


                    </div>


                </div>


            </div>



            <!-- =================================================
                 MAIN MESSAGE
            ================================================== -->

            <h3 id="loadingMessage">

                🔐 Initializing Secure Login...

            </h3>



            <!-- =================================================
                 SMALL STATUS
            ================================================== -->

            <p
                id="loginStatus"
                class="login-status"
            >

                Preparing secure authentication...

            </p>


        </div>


    </div>



    <!-- =====================================================
         GOOGLE LOGIN SCRIPT
    ====================================================== -->

    <script>

        function googleLogin() {

    const GOOGLE_LOGIN_URL =
        "https://ai-visibility-analyzer.onrender.com/google/login";


    /* =========================================================
       LOADER SETTINGS
       ========================================================= */

    const MAX_PROGRESS = 94;

    const START_SPEED = 0.12;

    const MIN_PROGRESS = 0;


    /* =========================================================
       PREVENT DOUBLE CLICK
       ========================================================= */

    if (
        window.__googleLoginStarted === true
    ) {

        return;

    }


    window.__googleLoginStarted = true;


    /* =========================================================
       GET LOADER ELEMENTS
       ========================================================= */

    const overlay =
        document.getElementById(
            "loadingOverlay"
        );


    const progressBar =
        document.getElementById(
            "loginProgressBar"
        );


    const percentage =
        document.getElementById(
            "loadingPercentage"
        );


    const message =
        document.getElementById(
            "loadingMessage"
        );


    const status =
        document.getElementById(
            "loginStatus"
        );


    /* =========================================================
       SAFETY CHECK
       ========================================================= */

    if (
        !overlay ||
        !progressBar ||
        !percentage ||
        !message ||
        !status
    ) {

        console.error(
            "Login loader elements are missing."
        );


        window.location.href =
            GOOGLE_LOGIN_URL;


        return;

    }


    /* =========================================================
       SHOW LOADER
       ========================================================= */

    overlay.style.display =
        "flex";


    overlay.setAttribute(
        "aria-hidden",
        "false"
    );


    document.body.classList.add(
        "login-loading"
    );


    /* =========================================================
       DISABLE GOOGLE BUTTON
       ========================================================= */

    const googleButton =
        document.querySelector(
            ".google-btn"
        );


    if (googleButton) {

        googleButton.disabled =
            true;


        googleButton.style.opacity =
            "0.7";


        googleButton.style.cursor =
            "wait";

    }


    /* =========================================================
       DISABLE BACK HOME
       ========================================================= */

    const backHome =
        document.getElementById(
            "backHome"
        );


    if (backHome) {

        backHome.style.pointerEvents =
            "none";


        backHome.style.opacity =
            "0.6";

    }


    /* =========================================================
       INITIAL LOADER STATE
       ========================================================= */

    let progress =
        MIN_PROGRESS;


    let animationFrame =
        null;


    let redirectStarted =
        false;


    percentage.textContent =
        "0%";


    progressBar.style.width =
        "0%";


    message.innerHTML =
        "🔐 Initializing Secure Login...";


    status.innerHTML =
        "Preparing secure authentication...";


    /* =========================================================
       UPDATE LOGIN MESSAGE
       ========================================================= */

    function updateStatus(
        currentProgress
    ) {


        if (
            currentProgress < 15
        ) {

            message.innerHTML =
                "🔐 Initializing Secure Login...";


            status.innerHTML =
                "Preparing secure authentication...";


            return;

        }


        if (
            currentProgress < 30
        ) {

            message.innerHTML =
                "🌐 Connecting to Google...";


            status.innerHTML =
                "Establishing secure connection...";


            return;

        }


        if (
            currentProgress < 50
        ) {

            message.innerHTML =
                "🔍 Preparing Authentication...";


            status.innerHTML =
                "Preparing your secure Google session...";


            return;

        }


        if (
            currentProgress < 70
        ) {

            message.innerHTML =
                "🛡 Securing Login Session...";


            status.innerHTML =
                "Creating a secure authentication session...";


            return;

        }


        if (
            currentProgress < 85
        ) {

            message.innerHTML =
                "🚀 Almost Ready...";


            status.innerHTML =
                "Waiting for secure Google authentication...";


            return;

        }


        message.innerHTML =
            "🔐 Secure Google Sign-In";


        status.innerHTML =
            "Waiting for Google authentication...";

    }


    /* =========================================================
       SMOOTH CONTINUOUS LOADER
       =========================================================

       IMPORTANT:

       There is NO fixed timer here.

       The loader continues moving while the browser is
       preparing the Google redirect.

       It gradually slows down near 94%.

       It NEVER reaches 100% on the login page because
       authentication has not completed yet.
       ========================================================= */

    function animateLoader() {


        if (
            redirectStarted
        ) {

            return;

        }


        const remaining =
            MAX_PROGRESS -
            progress;


        /*
         * The closer we get to MAX_PROGRESS,
         * the slower the movement becomes.
         */

        const increment =
            Math.max(
                START_SPEED,
                remaining * 0.008
            );


        progress +=
            increment;


        if (
            progress >= MAX_PROGRESS
        ) {

            progress =
                MAX_PROGRESS;

        }


        progressBar.style.width =
            progress + "%";


        percentage.textContent =
            Math.floor(
                progress
            ) + "%";


        updateStatus(
            progress
        );


        /*
         * Keep running continuously.
         */

        animationFrame =
            requestAnimationFrame(
                animateLoader
            );

    }


    /* =========================================================
       START SMOOTH LOADER
       ========================================================= */

    animationFrame =
        requestAnimationFrame(
            animateLoader
        );


    /* =========================================================
       REDIRECT TO GOOGLE
       =========================================================

       We DO NOT wait for a fake percentage.

       We start the authentication redirect immediately.

       The loader remains visible during navigation.
       ========================================================= */

    window.setTimeout(
        function () {


            if (
                redirectStarted
            ) {

                return;

            }


            redirectStarted =
                true;


            /*
             * Stop the animation just before redirect.
             */

            if (
                animationFrame !== null
            ) {

                cancelAnimationFrame(
                    animationFrame
                );


                animationFrame =
                    null;

            }


            /*
             * Hold at current position.
             *
             * It may be 40%, 60%, 80%, 90%, etc.,
             * depending on how quickly the browser
             * reaches the redirect.
             */

            progressBar.style.width =
                progress + "%";


            percentage.textContent =
                Math.floor(
                    progress
                ) + "%";


            message.innerHTML =
                "🔐 Connecting to Google...";


            status.innerHTML =
                "Opening secure Google authentication...";


            /*
             * Allow the browser to paint the final
             * loader state before navigation.
             */

            window.setTimeout(
                function () {


                    window.location.href =
                        GOOGLE_LOGIN_URL;


                },
                100
            );


        },
        300
    );

}


    </script>


</body>

</html>
