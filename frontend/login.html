<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | AI Visibility Analyzer</title>

    <link
        rel="stylesheet"
        href="css/login.css"
    >

</head>


<body>

<div class="auth-container">

    <div class="auth-card">

        <!-- LOGO / BRAND -->

        <div class="brand">

            <div class="brand-icon">
                🤖
            </div>

            <h1>
                AI Visibility Analyzer
            </h1>

            <p>
                Analyze how AI platforms understand your website.
            </p>

        </div>


        <!-- TABS -->

        <div class="auth-tabs">

            <button
                id="loginTab"
                class="auth-tab active"
                onclick="showLogin()"
            >
                Login
            </button>

            <button
                id="registerTab"
                class="auth-tab"
                onclick="showRegister()"
            >
                Register
            </button>

        </div>


        <!-- =========================
             LOGIN FORM
        ========================== -->

        <form
            id="loginForm"
            class="auth-form"
        >

            <h2>
                Welcome Back
            </h2>

            <p class="form-subtitle">
                Login to your AI Visibility Dashboard
            </p>


            <label>
                Email
            </label>

            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
                required
            >


            <button
                type="submit"
                class="primary-btn"
            >
                Login
            </button>

        </form>


        <!-- =========================
             REGISTER FORM
        ========================== -->

        <form
            id="registerForm"
            class="auth-form hidden"
        >

            <h2>
                Create Account
            </h2>

            <p class="form-subtitle">
                Create your AI Visibility Analyzer account
            </p>


            <label>
                Full Name
            </label>

            <input
                type="text"
                id="registerName"
                placeholder="Enter your full name"
                required
            >


            <label>
                Email
            </label>

            <input
                type="email"
                id="registerEmail"
                placeholder="Enter your email"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                id="registerPassword"
                placeholder="Create a password"
                required
            >


            <button
                type="submit"
                class="primary-btn"
            >
                Create Account
            </button>

        </form>


        <!-- DIVIDER -->

        <div class="divider">

            <span>OR</span>

        </div>


        <!-- GOOGLE LOGIN -->

        <button
            type="button"
            class="google-btn"
            onclick="googleLogin()"
        >

            <img
                src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
                alt="Google"
            >

            <span>
                Continue with Google
            </span>

        </button>


        <!-- MESSAGE -->

        <div
            id="message"
            class="message"
        ></div>


        <a
            href="index.html"
            class="back-home"
        >
            ← Back to Home
        </a>

    </div>

</div>


<script src="js/login.js"></script>

</body>

</html>
