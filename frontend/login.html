<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Login | AI Visibility Analyzer
    </title>


    <!-- =====================================================
         CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="css/login.css"
    >

</head>


<body>


    <!-- =====================================================
         LOGIN CARD
    ====================================================== -->

    <div class="login-card">


        <h1>

            Welcome Back

        </h1>


        <p>

            Sign in with your Google account to access
            your AI Visibility Dashboard.

        </p>


        <!-- =================================================
             GOOGLE LOGIN BUTTON
        ================================================== -->

        <button
            type="button"
            class="google-btn"
            onclick="googleLogin()"
        >

            <img
                src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
                alt="Google Logo"
            >

            <span>

                Continue with Google

            </span>

        </button>


        <!-- =================================================
             BACK HOME
        ================================================== -->

        <a
            href="index.html"
            class="back-home"
        >

            ← Back to Home

        </a>


    </div>



    <!-- =====================================================
         LOADING OVERLAY
    ====================================================== -->

    <div
        id="loadingOverlay"
        class="loading-overlay"
    >


        <div class="loader-card">


            <!-- =================================================
                 AI ICON
            ================================================== -->

            <div class="ai-logo">

                🤖

            </div>


            <!-- =================================================
                 TITLE
            ================================================== -->

            <h2>

                AI Visibility Analyzer

            </h2>


            <!-- =================================================
                 HORIZONTAL PROGRESS BAR
            ================================================== -->

            <div class="login-progress-container">


                <div class="login-progress-track">


                    <div
                        id="loginProgressBar"
                        class="login-progress-bar"
                    >

                        <span
                            id="loadingPercentage"
                            class="login-progress-text"
                        >

                            0%

                        </span>


                    </div>


                </div>


            </div>



            <!-- =================================================
                 MAIN MESSAGE
            ================================================== -->

            <h3 id="loadingMessage">

                🔐 Initializing Secure Login...

            </h3>



            <!-- =================================================
                 SMALL STATUS
            ================================================== -->

            <p
                id="loginStatus"
                class="login-status"
            >

                Preparing secure authentication...

            </p>


        </div>


    </div>



    <!-- =====================================================
         GOOGLE LOGIN SCRIPT
    ====================================================== -->

    <script>

        function googleLogin() {


            /* =================================================
               GET ELEMENTS
            ================================================= */

            const overlay =
                document.getElementById(
                    "loadingOverlay"
                );

            const progressBar =
                document.getElementById(
                    "loginProgressBar"
                );

            const percentage =
                document.getElementById(
                    "loadingPercentage"
                );

            const message =
                document.getElementById(
                    "loadingMessage"
                );

            const status =
                document.getElementById(
                    "loginStatus"
                );


            /* =================================================
               SAFETY CHECK
            ================================================= */

            if (
                !overlay ||
                !progressBar ||
                !percentage ||
                !message ||
                !status
            ) {

                window.location.href =
                    "https://ai-visibility-analyzer.onrender.com/google/login";

                return;

            }


            /* =================================================
               SHOW LOADING OVERLAY
            ================================================= */

            overlay.style.display = "flex";


            /* =================================================
               DISABLE GOOGLE BUTTON
            ================================================= */

            const googleButton =
                document.querySelector(
                    ".google-btn"
                );

            if (googleButton) {

                googleButton.disabled = true;

                googleButton.style.opacity =
                    "0.7";

                googleButton.style.cursor =
                    "wait";

            }


            /* =================================================
               INITIAL PROGRESS
            ================================================= */

            let progress = 0;

            let redirectStarted = false;


            /* =================================================
               RESET UI
            ================================================= */

            percentage.textContent =
                "0%";

            progressBar.style.width =
                "0%";

            message.innerHTML =
                "🔐 Initializing Secure Login...";

            status.innerHTML =
                "Preparing secure authentication...";


            /* =================================================
               SMOOTH PROGRESS TIMER

               The progress intentionally slows down
               as it approaches 100%.
            ================================================= */

            const timer =
                setInterval(
                    function () {


                        /* -------------------------------------
                           0% - 30%

                           Faster initial movement
                        ------------------------------------- */

                        if (progress < 30) {

                            progress += 0.65;

                        }


                        /* -------------------------------------
                           30% - 60%

                           Medium speed
                        ------------------------------------- */

                        else if (progress < 60) {

                            progress += 0.45;

                        }


                        /* -------------------------------------
                           60% - 80%

                           Slower
                        ------------------------------------- */

                        else if (progress < 80) {

                            progress += 0.30;

                        }


                        /* -------------------------------------
                           80% - 90%

                           More gradual
                        ------------------------------------- */

                        else if (progress < 90) {

                            progress += 0.20;

                        }


                        /* -------------------------------------
                           90% - 97%

                           Slow progress
                        ------------------------------------- */

                        else if (progress < 97) {

                            progress += 0.12;

                        }


                        /* -------------------------------------
                           97% - 100%

                           Very smooth final movement
                        ------------------------------------- */

                        else if (progress < 100) {

                            progress += 0.05;

                        }


                        /* -------------------------------------
                           NEVER EXCEED 100%
                        ------------------------------------- */

                        progress =
                            Math.min(
                                progress,
                                100
                            );


                        /* -------------------------------------
                           UPDATE PERCENTAGE
                        ------------------------------------- */

                        percentage.textContent =
                            Math.floor(progress) + "%";


                        /* -------------------------------------
                           UPDATE PROGRESS BAR
                        ------------------------------------- */

                        progressBar.style.width =
                            progress + "%";


                        /* =================================================
                           STATUS MESSAGES
                        ================================================== */

                        if (progress < 15) {

                            message.innerHTML =
                                "🔐 Initializing Secure Login...";

                            status.innerHTML =
                                "Preparing secure authentication...";

                        }


                        else if (progress < 30) {

                            message.innerHTML =
                                "🌐 Connecting to Google...";

                            status.innerHTML =
                                "Establishing secure connection...";

                        }


                        else if (progress < 50) {

                            message.innerHTML =
                                "🔍 Verifying Authentication...";

                            status.innerHTML =
                                "Waiting for Google authentication...";

                        }


                        else if (progress < 70) {

                            message.innerHTML =
                                "🛡 Securing Session...";

                            status.innerHTML =
                                "Creating your secure session...";

                        }


                        else if (progress < 90) {

                            message.innerHTML =
                                "⚙️ Preparing Dashboard...";

                            status.innerHTML =
                                "Loading your secure workspace...";

                        }


                        else if (progress < 100) {

                            message.innerHTML =
                                "🚀 Almost Ready...";

                            status.innerHTML =
                                "Finalizing secure login...";

                        }


                        /* =================================================
                           REACHED 100%
                        ================================================== */

                        if (
                            progress >= 100 &&
                            !redirectStarted
                        ) {

                            redirectStarted = true;


                            /* ---------------------------------------------
                               STOP TIMER
                            --------------------------------------------- */

                            clearInterval(timer);


                            /* ---------------------------------------------
                               FORCE EXACT 100%
                            --------------------------------------------- */

                            percentage.textContent =
                                "100%";

                            progressBar.style.width =
                                "100%";


                            /* ---------------------------------------------
                               SUCCESS MESSAGE
                            --------------------------------------------- */

                            message.innerHTML =
                                "✅ Login Successful!";

                            status.innerHTML =
                                "Opening your dashboard...";


                            /* ---------------------------------------------
                               WAIT BRIEFLY SO USER CAN SEE 100%
                            --------------------------------------------- */

                            setTimeout(
                                function () {


                                    /*
                                     * IMPORTANT:
                                     *
                                     * This starts your existing
                                     * Google OAuth authentication.
                                     *
                                     * After successful authentication,
                                     * your backend should redirect
                                     * the user to the dashboard.
                                     */

                                    window.location.href =
                                        "https://ai-visibility-analyzer.onrender.com/google/login";


                                },
                                700
                            );

                        }


                    },
                    50
                );

        }



    </script>


</body>

</html>
