<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Login | AI Visibility Analyzer
    </title>


    <!-- =====================================================
         CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="css/login.css"
    >

</head>


<body>


    <!-- =====================================================
         LOGIN CARD
    ====================================================== -->

    <div class="login-card">


        <h1>

            Welcome Back

        </h1>


        <p>

            Sign in with your Google account to access
            your AI Visibility Dashboard.

        </p>


        <!-- =================================================
             GOOGLE LOGIN BUTTON
        ================================================== -->

        <button
            type="button"
            class="google-btn"
            onclick="googleLogin()"
        >

            <img
                src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
                alt="Google Logo"
            >

            <span>

                Continue with Google

            </span>

        </button>


        <!-- =================================================
             BACK HOME
        ================================================== -->

        <a
            href="index.html"
            class="back-home"
        >

            ← Back to Home

        </a>


    </div>



    <!-- =====================================================
         LOADING OVERLAY
    ====================================================== -->

    <div
        id="loadingOverlay"
        class="loading-overlay"
    >


        <div class="loader-card">


            <!-- =================================================
                 AI ICON
            ================================================== -->

            <div class="ai-logo">

                🤖

            </div>


            <!-- =================================================
                 TITLE
            ================================================== -->

            <h2>

                AI Visibility Analyzer

            </h2>


            <!-- =================================================
                 HORIZONTAL PROGRESS BAR
            ================================================== -->

            <div class="login-progress-container">


                <div class="login-progress-track">


                    <div
                        id="loginProgressBar"
                        class="login-progress-bar"
                    >

                        <span
                            id="loadingPercentage"
                            class="login-progress-text"
                        >

                            0%

                        </span>


                    </div>


                </div>


            </div>



            <!-- =================================================
                 MAIN MESSAGE
            ================================================== -->

            <h3 id="loadingMessage">

                🔐 Initializing Secure Login...

            </h3>



            <!-- =================================================
                 SMALL STATUS
            ================================================== -->

            <p
                id="loginStatus"
                class="login-status"
            >

                Preparing secure authentication...

            </p>


        </div>


    </div>



    <!-- =====================================================
         GOOGLE LOGIN SCRIPT
    ====================================================== -->

    <script>

        function googleLogin() {


            /* =================================================
               GET ELEMENTS
            ================================================= */

            const overlay =
                document.getElementById(
                    "loadingOverlay"
                );


            const progressBar =
                document.getElementById(
                    "loginProgressBar"
                );


            const percentage =
                document.getElementById(
                    "loadingPercentage"
                );


            const message =
                document.getElementById(
                    "loadingMessage"
                );


            const status =
                document.getElementById(
                    "loginStatus"
                );



            /* =================================================
               SAFETY CHECK
            ================================================= */

            if (
                !overlay ||
                !progressBar ||
                !percentage ||
                !message ||
                !status
            ) {

                window.location.href =
                    "https://ai-visibility-analyzer.onrender.com/google/login";

                return;

            }



            /* =================================================
               SHOW LOADER
            ================================================= */

            overlay.style.display = "flex";



            /* =================================================
               DISABLE GOOGLE BUTTON
            ================================================= */

            const googleButton =
                document.querySelector(
                    ".google-btn"
                );


            if (googleButton) {

                googleButton.disabled = true;

                googleButton.style.opacity = "0.7";

                googleButton.style.cursor = "wait";

            }



            /* =================================================
               INITIAL PROGRESS
            ================================================= */

            let progress = 0;

            let redirectStarted = false;



            /* =================================================
               RESET UI
            ================================================= */

            percentage.textContent = "0%";

            progressBar.style.width = "0%";

            message.innerHTML =
                "🔐 Initializing Secure Login...";

            status.innerHTML =
                "Preparing secure authentication...";



            /* =================================================
               PROGRESS TIMER

               0%
               ↓
               20%
               ↓
               40%
               ↓
               60%
               ↓
               80%
               ↓
               95%
               ↓
               96%
               ↓
               97%
               ↓
               98%
               ↓
               99%
               ↓
               GOOGLE LOGIN
            ================================================== */

            const timer =
                setInterval(
                    function () {


                        /* -------------------------------------
                           0 - 20%
                        ------------------------------------- */

                        if (progress < 20) {

                            progress += 2.5;

                        }


                        /* -------------------------------------
                           20 - 40%
                        ------------------------------------- */

                        else if (progress < 40) {

                            progress += 2;

                        }


                        /* -------------------------------------
                           40 - 60%
                        ------------------------------------- */

                        else if (progress < 60) {

                            progress += 1.5;

                        }


                        /* -------------------------------------
                           60 - 80%
                        ------------------------------------- */

                        else if (progress < 80) {

                            progress += 1;

                        }


                        /* -------------------------------------
                           80 - 95%
                        ------------------------------------- */

                        else if (progress < 95) {

                            progress += 0.5;

                        }


                        /* -------------------------------------
                           95 - 99%

                           THIS FIXES THE OLD 95% STOP
                        ------------------------------------- */

                        else if (progress < 99) {

                            progress += 0.15;

                        }



                        /* -------------------------------------
                           NEVER EXCEED 99%
                        ------------------------------------- */

                        progress =
                            Math.min(
                                progress,
                                99
                            );



                        /* -------------------------------------
                           UPDATE PERCENTAGE
                        ------------------------------------- */

                        percentage.textContent =
                            Math.floor(progress) + "%";



                        /* -------------------------------------
                           UPDATE PROGRESS BAR
                        ------------------------------------- */

                        progressBar.style.width =
                            progress + "%";



                        /* =================================================
                           STATUS MESSAGES
                        ================================================== */

                        if (progress < 20) {


                            message.innerHTML =
                                "🔐 Initializing Secure Login...";


                            status.innerHTML =
                                "Preparing secure authentication...";


                        }


                        else if (progress < 45) {


                            message.innerHTML =
                                "🌐 Connecting to Google...";


                            status.innerHTML =
                                "Establishing secure connection...";


                        }


                        else if (progress < 70) {


                            message.innerHTML =
                                "🔍 Verifying Authentication...";


                            status.innerHTML =
                                "Waiting for Google authentication...";


                        }


                        else if (progress < 90) {


                            message.innerHTML =
                                "🛡 Securing Session...";


                            status.innerHTML =
                                "Creating your secure session...";


                        }


                        else {


                            message.innerHTML =
                                "🚀 Almost Ready...";


                            status.innerHTML =
                                "Redirecting to secure Google login...";


                        }



                        /* =================================================
                           REDIRECT AT 99%
                        ================================================== */

                        if (
                            progress >= 99 &&
                            !redirectStarted
                        ) {


                            redirectStarted = true;


                            /* ---------------------------------------------
                               STOP TIMER
                            --------------------------------------------- */

                            clearInterval(timer);



                            /* ---------------------------------------------
                               FIX PROGRESS AT 99%
                            --------------------------------------------- */

                            percentage.textContent =
                                "99%";


                            progressBar.style.width =
                                "99%";



                            /* ---------------------------------------------
                               FINAL MESSAGE
                            --------------------------------------------- */

                            message.innerHTML =
                                "🚀 Connecting to Google...";


                            status.innerHTML =
                                "Opening secure authentication...";



                            /* ---------------------------------------------
                               GIVE BROWSER TIME TO PAINT 99%
                            --------------------------------------------- */

                            setTimeout(
                                function () {


                                    /*
                                     * KEEPING YOUR EXISTING
                                     * GOOGLE AUTHENTICATION URL
                                     */

                                    window.location.href =
                                        "https://ai-visibility-analyzer.onrender.com/google/login";


                                },
                                150
                            );


                        }


                    },
                    50
                );


        }


    </script>


</body>

</html>
