<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Login | AI Visibility Analyzer
    </title>


    <!-- =====================================================
         CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="css/login.css"
    >

</head>


<body>


    <!-- =====================================================
         LOGIN CARD
    ====================================================== -->

    <div class="login-card">


        <h1>

            Welcome Back

        </h1>


        <p>

            Sign in with your Google account to access
            your AI Visibility Dashboard.

        </p>


        <!-- =================================================
             GOOGLE LOGIN BUTTON
        ================================================== -->

        <button
            type="button"
            class="google-btn"
            onclick="googleLogin()"
        >

            <img
                src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
                alt="Google Logo"
            >

            <span>

                Continue with Google

            </span>

        </button>


        <!-- =================================================
             BACK HOME
        ================================================== -->

        <a
            href="index.html"
            class="back-home"
        >

            ← Back to Home

        </a>


    </div>



    <!-- =====================================================
         LOADING OVERLAY
    ====================================================== -->

    <div
        id="loadingOverlay"
        class="loading-overlay"
    >


        <div class="loader-card">


            <!-- =================================================
                 AI ICON
            ================================================== -->

            <div class="ai-logo">

                🤖

            </div>


            <!-- =================================================
                 TITLE
            ================================================== -->

            <h2>

                AI Visibility Analyzer

            </h2>


            <!-- =================================================
                 HORIZONTAL PROGRESS BAR
            ================================================== -->

            <div class="login-progress-container">


                <div class="login-progress-track">


                    <div
                        id="loginProgressBar"
                        class="login-progress-bar"
                    >

                        <span
                            id="loadingPercentage"
                            class="login-progress-text"
                        >

                            0%

                        </span>


                    </div>


                </div>


            </div>



            <!-- =================================================
                 MAIN MESSAGE
            ================================================== -->

            <h3 id="loadingMessage">

                🔐 Initializing Secure Login...

            </h3>



            <!-- =================================================
                 SMALL STATUS
            ================================================== -->

            <p
                id="loginStatus"
                class="login-status"
            >

                Preparing secure authentication...

            </p>


        </div>


    </div>



    <!-- =====================================================
         GOOGLE LOGIN SCRIPT
    ====================================================== -->

    <script>

        function googleLogin() {

    const GOOGLE_LOGIN_URL =
        "https://ai-visibility-analyzer.onrender.com/google/login";

    const MAX_PROGRESS = 92;
    const PROGRESS_DURATION = 2600;
    const MINIMUM_LOADER_TIME = 1600;

    if (window.__googleLoginStarted === true) {
        return;
    }

    window.__googleLoginStarted = true;

    const overlay =
        document.getElementById("loadingOverlay");

    const progressBar =
        document.getElementById("loginProgressBar");

    const percentage =
        document.getElementById("loadingPercentage");

    const message =
        document.getElementById("loadingMessage");

    const status =
        document.getElementById("loginStatus");

    if (
        !overlay ||
        !progressBar ||
        !percentage ||
        !message ||
        !status
    ) {
        console.error("Login loader elements are missing.");
        window.location.href = GOOGLE_LOGIN_URL;
        return;
    }

    overlay.style.display = "flex";
    overlay.setAttribute("aria-hidden", "false");

    document.body.classList.add("login-loading");

    const googleButton =
        document.querySelector(".google-btn");

    if (googleButton) {
        googleButton.disabled = true;
        googleButton.style.opacity = "0.7";
        googleButton.style.cursor = "wait";
    }

    const backHome =
        document.getElementById("backHome");

    if (backHome) {
        backHome.style.pointerEvents = "none";
        backHome.style.opacity = "0.6";
    }

    let animationFrame = null;

    const startTime = performance.now();

    percentage.textContent = "0%";
    progressBar.style.width = "0%";

    message.innerHTML =
        "🔐 Initializing Secure Login...";

    status.innerHTML =
        "Preparing secure authentication...";

    function updateStatus(currentProgress) {

        if (currentProgress < 15) {

            message.innerHTML =
                "🔐 Initializing Secure Login...";

            status.innerHTML =
                "Preparing secure authentication...";

            return;
        }

        if (currentProgress < 35) {

            message.innerHTML =
                "🌐 Connecting to Google...";

            status.innerHTML =
                "Establishing secure connection...";

            return;
        }

        if (currentProgress < 55) {

            message.innerHTML =
                "🔍 Verifying Authentication...";

            status.innerHTML =
                "Preparing your Google authentication session...";

            return;
        }

        if (currentProgress < 75) {

            message.innerHTML =
                "🛡 Securing Session...";

            status.innerHTML =
                "Creating your secure login session...";

            return;
        }

        if (currentProgress < 90) {

            message.innerHTML =
                "🚀 Almost Ready...";

            status.innerHTML =
                "Preparing secure Google authentication...";

            return;
        }

        message.innerHTML =
            "🚀 Connecting to Google...";

        status.innerHTML =
            "Opening secure authentication...";
    }

    function animate(currentTime) {

        const elapsed =
            currentTime - startTime;

        const rawProgress =
            Math.min(
                elapsed / PROGRESS_DURATION,
                1
            );

        const easedProgress =
            1 - Math.pow(
                1 - rawProgress,
                3
            );

        const progress =
            MAX_PROGRESS * easedProgress;

        percentage.textContent =
            Math.floor(progress) + "%";

        progressBar.style.width =
            progress + "%";

        updateStatus(progress);

        if (rawProgress < 1) {

            animationFrame =
                requestAnimationFrame(animate);

        } else {

            percentage.textContent =
                MAX_PROGRESS + "%";

            progressBar.style.width =
                MAX_PROGRESS + "%";

            updateStatus(MAX_PROGRESS);
        }
    }

    animationFrame =
        requestAnimationFrame(animate);

    const elapsed =
        performance.now() - startTime;

    const remaining =
        Math.max(
            0,
            MINIMUM_LOADER_TIME - elapsed
        );

    setTimeout(
        function () {

            if (animationFrame !== null) {

                cancelAnimationFrame(
                    animationFrame
                );

                animationFrame = null;
            }

            percentage.textContent =
                MAX_PROGRESS + "%";

            progressBar.style.width =
                MAX_PROGRESS + "%";

            message.innerHTML =
                "🚀 Connecting to Google...";

            status.innerHTML =
                "Opening secure authentication...";

            setTimeout(
                function () {

                    window.location.href =
                        GOOGLE_LOGIN_URL;

                },
                180
            );

        },
        remaining
    );
}


    </script>


</body>

</html>
