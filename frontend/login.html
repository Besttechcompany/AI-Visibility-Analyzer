<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Login | AI Visibility Analyzer
    </title>

    <link
        rel="stylesheet"
        href="css/login.css"
    >

</head>


<body>


    <!-- =====================================================
         LOGIN CARD
    ====================================================== -->

    <div class="login-card">

        <h1>
            Welcome Back
        </h1>


        <p>
            Sign in with your Google account to access
            your AI Visibility Dashboard.
        </p>


        <!-- =================================================
             GOOGLE LOGIN BUTTON
        ================================================== -->

        <button
            type="button"
            class="google-btn"
            onclick="googleLogin()"
        >

            <img
                src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
                alt="Google Logo"
            >

            <span>
                Continue with Google
            </span>

        </button>


        <!-- =================================================
             BACK HOME
        ================================================== -->

        <a
            href="index.html"
            class="back-home"
        >

            ← Back to Home

        </a>

    </div>



    <!-- =====================================================
         LOADING OVERLAY
    ====================================================== -->

    <div
        id="loadingOverlay"
        class="loading-overlay"
    >

        <div class="loader-card">


            <!-- AI ICON -->

            <div class="ai-logo">
                🤖
            </div>


            <!-- TITLE -->

            <h2>
                AI Visibility Analyzer
            </h2>


            <!-- =================================================
                 HORIZONTAL PROGRESS BAR
            ================================================== -->

            <div class="login-progress-container">

                <div class="login-progress-track">

                    <div
                        id="loginProgressBar"
                        class="login-progress-bar"
                    >

                        <span
                            id="loadingPercentage"
                            class="login-progress-text"
                        >
                            0%
                        </span>

                    </div>

                </div>

            </div>


            <!-- MAIN MESSAGE -->

            <h3 id="loadingMessage">

                🔐 Initializing Secure Login...

            </h3>


            <!-- SMALL STATUS -->

            <p
                id="loginStatus"
                class="login-status"
            >

                Preparing secure authentication...

            </p>


        </div>

    </div>



    <!-- =====================================================
         GOOGLE LOGIN SCRIPT
    ====================================================== -->

    <script>

        function googleLogin() {


            /* =================================================
               GET ELEMENTS
            ================================================= */

            const overlay =
                document.getElementById(
                    "loadingOverlay"
                );

            const progressBar =
                document.getElementById(
                    "loginProgressBar"
                );

            const percentage =
                document.getElementById(
                    "loadingPercentage"
                );

            const message =
                document.getElementById(
                    "loadingMessage"
                );

            const status =
                document.getElementById(
                    "loginStatus"
                );


            /* =================================================
               SHOW LOADER
            ================================================= */

            overlay.style.display = "flex";


            /* =================================================
               DISABLE GOOGLE BUTTON
            ================================================= */

            const googleButton =
                document.querySelector(
                    ".google-btn"
                );

            if (googleButton) {

                googleButton.disabled = true;

                googleButton.style.opacity = "0.7";

                googleButton.style.cursor = "wait";

            }


            /* =================================================
               PROGRESS
            ================================================= */

            let progress = 0;


            let redirectStarted = false;


            /* =================================================
               PROGRESS TIMER

               Fast initial movement
               Slower near 99%

               IMPORTANT:
               It NEVER shows 100%.

               Authentication happens after
               this page redirects to Google.
            ================================================= */

            const timer =
                setInterval(
                    function () {


                        if (progress < 30) {

                            progress += 2.5;

                        }

                        else if (progress < 60) {

                            progress += 2;

                        }

                        else if (progress < 80) {

                            progress += 1.5;

                        }

                        else if (progress < 92) {

                            progress += 1;

                        }

                        else if (progress < 99) {

                            progress += 0.5;

                        }


                        /* =====================================
                           NEVER EXCEED 99%
                        ===================================== */

                        if (progress >= 99) {

                            progress = 99;

                        }


                        /* =====================================
                           UPDATE BAR
                        ===================================== */

                        percentage.textContent =
                            Math.floor(progress) + "%";


                        progressBar.style.width =
                            progress + "%";


                        /* =====================================
                           STATUS MESSAGES
                        ===================================== */

                        if (progress < 20) {

                            message.innerHTML =
                                "🔐 Initializing Secure Login...";

                            status.innerHTML =
                                "Preparing secure authentication...";

                        }

                        else if (progress < 45) {

                            message.innerHTML =
                                "🌐 Connecting to Google...";

                            status.innerHTML =
                                "Establishing secure connection...";

                        }

                        else if (progress < 70) {

                            message.innerHTML =
                                "🔍 Verifying Authentication...";

                            status.innerHTML =
                                "Waiting for Google authentication...";

                        }

                        else if (progress < 90) {

                            message.innerHTML =
                                "🛡 Securing Session...";

                            status.innerHTML =
                                "Creating your secure session...";

                        }

                        else {

                            message.innerHTML =
                                "🚀 Almost Ready...";

                            status.innerHTML =
                                "Redirecting to secure Google login...";

                        }


                        /* =====================================
                           REDIRECT AT 99%
                        ===================================== */

                        if (
                            progress >= 99 &&
                            !redirectStarted
                        ) {

                            redirectStarted = true;


                            clearInterval(timer);


                            percentage.textContent =
                                "99%";


                            progressBar.style.width =
                                "99%";


                            message.innerHTML =
                                "🚀 Connecting to Google...";


                            status.innerHTML =
                                "Opening secure authentication...";


                            /*
                             * Give the browser a tiny amount
                             * of time to paint the 99% state.
                             */

                            setTimeout(
                                function () {


                                    /*
                                     * KEEP YOUR EXISTING
                                     * GOOGLE AUTHENTICATION URL.
                                     */

                                    window.location.href =
                                        "https://ai-visibility-analyzer.onrender.com/google/login";


                                },
                                150
                            );

                        }


                    },
                    50
                );

        }

    </script>


</body>

</html>
